server:
  port: ${PORT:8080}
  address: 0.0.0.0
  http2:
    enabled: false

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      repository: "https://maven.lavalink.dev/releases"
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      repository: "https://maven.lavalink.dev/releases"
  server:
    password: "youshallnotpass"
    sources:
      youtube: false # Handled by youtube-plugin
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 1000 # 1s buffer — fast response, minimal memory overhead
    frameBufferDurationMs: 2500 # 2.5s frame buffer — optimal jitter protection for 512MB containers
    opusEncodingQuality: 8 # Crisp audio without excessive CPU load
    resamplingQuality: MEDIUM # Balanced audio resampling
    trackStuckThresholdMs: 3000 # Fast 3s recovery threshold for stuck tracks (no more 7s freezes)
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 100
    playerUpdateInterval: 5 # 5s client sync interval
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - ANDROID
      - IOS
      - MUSIC
      - TV
      - WEB
      - MWEB
      - WEBEMBEDDED
      - TVHTML5_SIMPLY
    # ── OAuth2: Bypasses YouTube datacenter IP blocking ──
    # Authenticates as a real Google account so YouTube serves all audio streams
    # (even commercial music releases and cloud IP blocked videos)
    oauth:
      enabled: true
      refreshToken: "${YOUTUBE_REFRESH_TOKEN:}"

  lavasrc:
    providers:
      - "scsearch:%QUERY%"
      - "ytmsearch:\"%ISRC%\""
      - "ytsearch:\"%ISRC%\""
      - "ytmsearch:%QUERY%"
      - "ytsearch:%QUERY%"
    sources:
      spotify: true
      applemusic: false
      deezer: false # Disabled: requires Deezer master decryption key
      yandexmusic: false
      flowerytts: false
    spotify:
      clientId: "${SPOTIFY_CLIENT_ID:}"
      clientSecret: "${SPOTIFY_CLIENT_SECRET:}"
      countryCode: "${SPOTIFY_COUNTRY_CODE:US}"

logging:
  level:
    root: INFO
    lavalink: INFO
    dev.lavalink.youtube: INFO
    dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO
