services:
  - type: web
    name: resobot
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: DEFAULT_VOLUME
        value: "50"
      - key: LAVALINK_HOST
        value: "lavalink.jirayu.net"
      - key: LAVALINK_PORT
        value: "13592"
      - key: LAVALINK_PASSWORD
        value: "youshallnotpass"
      - key: LAVALINK_SECURE
        value: "false"
