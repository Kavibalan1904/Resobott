server:
  port: 8080
  address: 0.0.0.0
  http2:
    enabled: true

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      repository: "https://maven.lavalink.dev/releases"
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      repository: "https://maven.lavalink.dev/releases"
  server:
    password: "youshallnotpass"
    sources:
      youtube: false
      bandcamp: false
      soundcloud: true
      twitch: false
      vimeo: false
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: false
      timescale: true
      tremolo: false
      vibrato: false
      distortion: false
      rotation: false
      channelMix: false
      lowPass: false
    bufferDurationMs: 1000 # 1s NAS buffer — smooth network cushion without high memory usage
    frameBufferDurationMs: 4000 # 4s frame buffer — prevents audio stutter while cutting heap memory in half
    opusEncodingQuality: 7 # Balanced encoding quality (crisp audio with lower CPU & memory)
    resamplingQuality: LOW # Low CPU and memory overhead during resampling
    trackStuckThresholdMs: 8000 # 8s threshold for responsive recovery
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 100
    playerUpdateInterval: 5 # Client tracks position locally; 5s server sync is plenty
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - ANDROID_VR
      - ANDROID_MUSIC
      - TV
      - MWEB
      - WEBEMBEDDED
      - WEB
  lavasrc:
    providers:
      - "ytsearch:\"%ISRC%\""
      - "ytsearch:%QUERY%"
    sources:
      spotify: true
      applemusic: true
      deezer: true
      yandexmusic: false
      flowerytts: false
      youtube: true
    spotify:
      countryCode: "US"

logging:
  level:
    root: INFO
    lavalink: INFO
