server:
  port: 7860
  address: 0.0.0.0
  http2:
    enabled: true

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      repository: "https://maven.lavalink.dev/releases"
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      repository: "https://maven.lavalink.dev/releases"
  server:
    password: "youshallnotpass"
    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 1000 # 1000ms NAS buffer — protects against GC pauses on free-tier hosting
    frameBufferDurationMs: 8000 # 8s frame buffer — large cushion against network jitter and GC spikes
    opusEncodingQuality: 8 # Crisp audio with significantly lower CPU load
    resamplingQuality: MEDIUM # Balanced resampling avoiding CPU spikes
    trackStuckThresholdMs: 5000 # Detect stuck tracks in 5s instead of 10s for faster retry
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 100
    playerUpdateInterval: 5 # Client tracks position locally; 5s server sync is plenty
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - ANDROID_VR
      - ANDROID_MUSIC
      - TV
      - MWEB
      - WEBEMBEDDED
      - WEB

logging:
  level:
    root: INFO
    lavalink: INFO
